<!DOCTYPE html>
<html lang='en'>

<head>
	<meta charset='utf-8'>
	<meta name='viewport' content='width=device-width, initial-scale=1'>
	<title>Page Title</title>
	<link rel='stylesheet' href='main.css'>
</head>

<body>
	<header class="bg-white border-b border-gray-100 shadow-xs">
		<div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
			<a href="feed/index.html" class="text-xl font-bold tracking-tight text-neutral-900">My CA Platform</a>

			<!-- Mobile Menu Button -->
			<button id="menu-toggle"
				class="md:hidden p-2 text-neutral-600 hover:text-neutral-900 hover:bg-neutral-50 rounded-md focus:outline-hidden transition"
				aria-label="Toggle menu">
				<!-- Hamburger Icon -->
				<svg id="hamburger-icon" class="size-6 block" fill="none" viewBox="0 0 24 24" stroke-width="2"
					stroke="currentColor">
					<path stroke-linecap="round" stroke-linejoin="round"
						d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
				</svg>
				<!-- Close Icon -->
				<svg id="close-icon" class="size-6 hidden" fill="none" viewBox="0 0 24 24" stroke-width="2"
					stroke="currentColor">
					<path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
				</svg>
			</button>

			<!-- Desktop Navigation -->
			<nav class="hidden md:flex items-center gap-x-8 text-sm font-medium text-neutral-600">
				<a href="feed/index.html" class="hover:text-neutral-900 transition">Home</a>
				<a href="index.html" class="hover:text-neutral-900 transition">My profile</a>
			</nav>
		</div>

		<!-- Mobile Dropdown Menu -->
		<nav id="mobile-menu" class="hidden md:hidden border-t border-gray-100 bg-neutral-50 py-3 px-4 shadow-inner">
			<div class="flex flex-col gap-y-2 text-base font-medium text-neutral-600">
				<a href="feed/index.html"
					class="px-3 py-2 rounded-md hover:bg-neutral-100 hover:text-neutral-900 transition">Home</a>
				<a href="index.html"
					class="px-3 py-2 rounded-md hover:bg-neutral-100 hover:text-neutral-900 transition">My profile</a>
			</div>
		</nav>
	</header>
</body>

</html>
